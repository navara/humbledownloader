name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole matrix before it builds anything.
  workflow_call:

# Checking out and running tests needs nothing else. Without this the job inherits the repository default, which can be read/write on every scope.
permissions:
  contents: read

jobs:
  test:
    # Both platforms on purpose: renames, reserved names and path handling differ between them. The project needs Python 3.15 or newer.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.15"]

    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version on purpose: setup-uv stopped publishing floating major tags after v7, so @v8, @v9 and @v10 do not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install project and locked dev dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
